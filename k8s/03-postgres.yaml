# Self-hosted Postgres for completeness / small deployments. For anything
# beyond a small departmental deployment, a managed Postgres (RDS, Cloud
# SQL, etc.) with pgvector support is strongly recommended instead of this
# StatefulSet — you get automated backups, failover, and patching for free.
# If you do use a managed DB, delete this file and point DATABASE_URL /
# DB_HOST at it instead.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: exam-portal
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: exam-portal-config, key: DB_USER } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: exam-portal-config, key: DB_NAME } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: exam-portal-secrets, key: DB_PASSWORD } }
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "$(POSTGRES_USER)"] }
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: pg-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: exam-portal
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
