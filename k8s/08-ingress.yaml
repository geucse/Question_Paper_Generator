# Assumes an nginx-ingress controller and cert-manager are already installed
# in the cluster (neither is included here — they're cluster-wide add-ons,
# not part of this application). Replace exam-portal.example.edu with your
# real domain, and letsencrypt-prod with your actual ClusterIssuer name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exam-portal-ingress
  namespace: exam-portal
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m" # matches the app's per-file upload limit with headroom
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["exam-portal.example.edu"]
      secretName: exam-portal-tls
  rules:
    - host: exam-portal.example.edu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
