# Template only — copy to secret.yaml, fill in real base64-encoded values,
# and DO NOT commit the filled-in version to version control.
# Encode a value with: echo -n 'the-actual-value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: exam-portal-secrets
  namespace: exam-portal
type: Opaque
data:
  DB_PASSWORD: eW91ci1kYi1wYXNzd29yZC1oZXJl        # "your-db-password-here"
  JWT_SECRET: eW91ci1qd3Qtc2VjcmV0LWhlcmU=          # "your-jwt-secret-here"
  ANTHROPIC_API_KEY: ""                              # optional, leave empty to skip AI-review language checks
  # Required (the backend refuses to start without a valid key): encrypts authenticator secrets at rest.
  # Generate with: openssl rand -hex 32 | tr -d '\n' | base64 -w0   (losing it means everyone re-enrols TOTP)
  TOTP_ENCRYPTION_KEY: cmVwbGFjZS13aXRoLTY0LWhleC1jaGFyYWN0ZXJz  # "replace-with-64-hex-characters" (invalid on purpose)
  # SMTP credentials for login codes, reset codes and invitations (both, or both empty for an unauthenticated relay).
  SMTP_USER: c210cC11c2VyLWhlcmU=                    # "smtp-user-here"
  SMTP_PASS: c210cC1wYXNzd29yZC1oZXJl                # "smtp-password-here"
  # Optional hardening (see backend/deploy/create-app-role.sql): omit
  # both keys entirely to skip — the backend deployment's shell logic then
  # leaves APP_DATABASE_URL unset and the app runs as DB_USER for
  # everything, same as before this feature existed.
  # APP_DB_USER: ZXhhbXBvcnRhbF9hcHA=               # "examportal_app"
  # APP_DB_PASSWORD: eW91ci1hcHAtcm9sZS1wYXNzd29yZA==  # "your-app-role-password"
