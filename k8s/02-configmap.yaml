apiVersion: v1
kind: ConfigMap
metadata:
  name: exam-portal-config
  namespace: exam-portal
data:
  DB_USER: "examportal"
  DB_NAME: "examportal"
  # Kubernetes Service DNS names resolve automatically within a namespace
  # (a Service named "postgres" is reachable as host "postgres" from any pod
  # in the same namespace) — no extra config needed for this to resolve.
  DB_HOST: "postgres"
  REDIS_URL: "redis://redis:6379"
  RATE_LIMIT_STORE: "redis"
  # Native clamd protocol over TCP to the clamav Service (backend/src/antivirus.js).
  CLAMD_HOST: "clamav"
  CLAMD_PORT: "3310"
  PORT: "4000"
  INSTITUTION_NAME: "Institution Name Not Configured"
  # Institution-wide "Note:" lines on every paper, "|"-separated (optional). The paper logo is read from
  # backend/assets/brand/institution-logo.png in the image (or INSTITUTION_LOGO_PATH); see that folder's README.
  PAPER_GENERAL_INSTRUCTIONS: ""
  NODE_ENV: "production"
  # The backend refuses to start in production unless these are valid (backend/src/runtime-config.js).
  CORS_ALLOWED_ORIGINS: "https://exam-portal.example.edu"
  # Proxy hops in front of the backend: ingress-nginx, then the frontend nginx.
  TRUST_PROXY: "2"
  OTP_DELIVERY_PROVIDER: "smtp"
  SMTP_HOST: "smtp.example.edu"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_FROM: "exam-portal@example.edu"
  PORTAL_URL: "https://exam-portal.example.edu"
  ACCOUNT_INVITE_TTL_HOURS: "72"
  ATTACHMENT_RESCAN_INTERVAL_MS: "600000"
  AUTO_BLOCK_MINUTES: "60"
  # TOTP_KEY_ROTATE: "yes"   # for ONE rollout only, to rotate TOTP_ENCRYPTION_KEY on purpose (every authenticator
  #                          # must then be set up again); without it a key that differs from the database's key
  #                          # check makes the backend refuse to start.
