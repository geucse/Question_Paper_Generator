server {
    # Non-root nginx (frontend/Dockerfile) cannot bind to port 80; publish 8080 instead
    # (docker-compose.prod.yml maps FRONTEND_PORT to it, the k8s Service targets it).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Container health (Dockerfile HEALTHCHECK, k8s probes): nginx itself, independent of the backend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA routing: any path that isn't a real file falls back to index.html
    # so client-side routing (if added later) and hard page refreshes both work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API access — the browser talks only to this nginx, which
    # forwards to the backend container by its Docker Compose / Kubernetes
    # service name. Avoids CORS entirely in production.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M; # matches the app's own per-file upload limit with headroom
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
